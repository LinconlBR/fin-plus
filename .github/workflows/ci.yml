name: CI

on:
  pull_request:
  push:
    branches: [main]

# O workflow só precisa ler o código: nega todo o resto por padrão.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior, que ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
